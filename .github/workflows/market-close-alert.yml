name: Market Close Alert

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # Run every 30 minutes on weekdays; job itself decides whether the NY close window is open.
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:
    inputs:
      run_at:
        description: "Optional ISO-8601 timestamp override for manual verification"
        required: false
        type: string

jobs:
  close-alert:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN_SIDE: ${{ secrets.TELEGRAM_BOT_TOKEN_SIDE }}
      TELEGRAM_CHAT_ID_SIDE: ${{ secrets.TELEGRAM_CHAT_ID_SIDE }}
      STATE_DB_URL: ${{ secrets.STATE_DB_URL }}
      STATE_DB_AUTH_TOKEN: ${{ secrets.STATE_DB_AUTH_TOKEN }}
      MARKET_PROVIDER: yahoo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/tech-news-digest
        run: pip install -r requirements.txt

      - name: Run close alert
        working-directory: services/tech-news-digest
        env:
          RUN_AT_OVERRIDE: ${{ github.event.inputs.run_at }}
        run: |
          if [ -n "$RUN_AT_OVERRIDE" ]; then
            python main.py close-alert --now "$RUN_AT_OVERRIDE"
          else
            python main.py close-alert
          fi
