name: Daily AI + Market Brief

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # 08:00 Asia/Shanghai = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-daily-brief:
    runs-on: [self-hosted, macOS, daily-news]
    env:
      TZ: Asia/Shanghai
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: 3.1-flash-preview
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'local-dummy-key' }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'http://127.0.0.1:8317/v1' }}
      OPENAI_MODEL: gpt-5.4-mini
      TELEGRAM_BOT_TOKEN_MAIN: ${{ secrets.TELEGRAM_BOT_TOKEN_MAIN }}
      TELEGRAM_CHAT_ID_MAIN: ${{ secrets.TELEGRAM_CHAT_ID_MAIN }}
      STATE_DB_URL: ${{ secrets.STATE_DB_URL }}
      STATE_DB_AUTH_TOKEN: ${{ secrets.STATE_DB_AUTH_TOKEN }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      MARKET_PROVIDER: ${{ vars.MARKET_PROVIDER || 'yahoo' }}
      MAX_ARTICLES_PER_SOURCE: "10"
      MAX_BRIEFING_ITEMS: "10"
      REQUEST_TIMEOUT: "20"
      PYTHON_BIN: /opt/homebrew/bin/python3.12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Python
        working-directory: services/tech-news-digest
        run: |
          "$PYTHON_BIN" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        working-directory: services/tech-news-digest
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Run daily brief
        working-directory: services/tech-news-digest
        run: .venv/bin/python main.py daily-brief

      - name: Upload daily assets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-market-brief-${{ github.run_id }}
          path: |
            services/tech-news-digest/reports/**
          if-no-files-found: ignore
