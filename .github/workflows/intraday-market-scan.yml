name: Intraday Market Scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # Run every 15 minutes on weekdays; job itself decides whether NYSE is open.
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      run_at:
        description: "Optional ISO-8601 timestamp override for manual verification"
        required: false
        type: string

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN_SIDE: ${{ secrets.TELEGRAM_BOT_TOKEN_SIDE }}
      TELEGRAM_CHAT_ID_SIDE: ${{ secrets.TELEGRAM_CHAT_ID_SIDE }}
      STATE_DB_URL: ${{ secrets.STATE_DB_URL }}
      STATE_DB_AUTH_TOKEN: ${{ secrets.STATE_DB_AUTH_TOKEN }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      MARKET_PROVIDER: ${{ vars.MARKET_PROVIDER || 'yahoo' }}
      MAX_INTRADAY_ALERTS_PER_DAY: "5"
      INTRADAY_INTERVAL_MINUTES: "15"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/tech-news-digest
        run: pip install -r requirements.txt

      - name: Run intraday scan
        working-directory: services/tech-news-digest
        env:
          RUN_AT_OVERRIDE: ${{ github.event.inputs.run_at }}
        run: |
          if [ -n "$RUN_AT_OVERRIDE" ]; then
            python main.py intraday-scan --now "$RUN_AT_OVERRIDE"
          else
            python main.py intraday-scan
          fi
